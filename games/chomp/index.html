<!doctype html>
<html lang="en" data-motion="auto">
<head>
<meta charset="utf-8">
<!-- user-scalable=no / maximum-scale=1 stop a stray pinch or double-tap firing
     mid-play. It matters here because the primary touch control is a SWIPE on
     the board, which is what a pinch starts as. Considered trade against WCAG
     1.4.4; iOS Safari ignores it for accessibility anyway. See the README. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#111318">
<meta name="description" content="Chomp — a maze chase built with vanilla JavaScript, following the classic arcade rules: four ghosts with four different targeting schemes, scatter and chase phases, and Cruise Elroy.">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' https://obkndxwkpodmcqumocfi.supabase.co http://127.0.0.1:54321 http://localhost:54321; img-src 'self' data:; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; base-uri 'none'; form-action 'none'">

<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chomp">
<meta name="mobile-web-app-capable" content="yes">

<title>Chomp</title>
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/backgrounds.css">
<link rel="stylesheet" href="../../css/animations.css">
<link rel="stylesheet" href="../../css/chomp.css">
<script src="../../js/shared/file-guard.js"></script>
</head>
<body>

<canvas id="bg-a" class="backdrop" aria-hidden="true"></canvas>
<canvas id="bg-b" class="backdrop" aria-hidden="true"></canvas>
<div class="backdrop-scrim" aria-hidden="true"></div>

<main class="app" id="app">

  <section class="field" aria-label="Playfield">
    <div class="field__slab">
      <!-- TWO canvases. The maze never changes shape, so it is painted once
           into its own layer and blitted; only the movers repaint each frame.
           Breakout splits the same way, and for the same reason. -->
      <div class="field__stack" id="field-stack">
        <canvas id="wall-canvas" class="layer" aria-hidden="true"></canvas>
        <canvas id="play-canvas" class="layer" role="img" aria-label="Chomp maze"></canvas>
      </div>
    </div>
  </section>

  <section class="panel panel--stats" aria-label="Statistics">
    <dl class="stats">
      <div class="stat">
        <dt class="stat__key">Score</dt>
        <dd class="stat__value stat__value--lead" id="stat-score">0</dd>
      </div>
      <div class="stat">
        <dt class="stat__key">Level</dt>
        <dd class="stat__value" id="stat-level">1</dd>
      </div>
      <div class="stat">
        <dt class="stat__key">Lives</dt>
        <dd class="stat__value">
          <span class="lives" id="stat-lives" role="img" aria-label="3 lives left"></span>
        </dd>
      </div>
    </dl>
    <p class="badge" id="badge" hidden></p>
    <div class="panel__actions">
      <button class="btn btn--ghost" id="btn-pause" type="button">Pause</button>
      <button class="btn btn--ghost" id="btn-settings" type="button">Settings</button>
      <button class="btn btn--ghost btn--icon" id="btn-mute" type="button"
              aria-label="Mute" aria-pressed="false" title="Mute"></button>
      <a class="btn btn--ghost" href="about/">About</a>
      <a class="btn btn--ghost" href="leaderboard/">Leaderboard</a>
      <a class="btn btn--ghost" href="../../">Arcade</a>
    </div>
  </section>

  <!-- On-screen controls, shown on coarse-pointer devices. Every target >= 48px.

       The buttons carry data-dir rather than data-action: a direction is a
       BUFFERED request that core applies at the first tile where the turn is
       legal, not an action to dispatch. See js/games/chomp/input/touch.js. -->
  <nav class="controls" id="controls" aria-label="Touch controls">
    <div class="controls__cluster controls__cluster--dpad">
      <button class="cbtn cbtn--dpad cbtn--up" type="button" data-dir="up" aria-label="Move up">▲</button>
      <button class="cbtn cbtn--dpad cbtn--left" type="button" data-dir="left" aria-label="Move left">◀</button>
      <button class="cbtn cbtn--dpad cbtn--down" type="button" data-dir="down" aria-label="Move down">▼</button>
      <button class="cbtn cbtn--dpad cbtn--right" type="button" data-dir="right" aria-label="Move right">▶</button>
    </div>
  </nav>

</main>

<div class="overlay" id="overlay" hidden>
  <div class="overlay__card" role="dialog" aria-modal="true"
       aria-labelledby="overlay-title" id="overlay-card">
    <h1 class="overlay__title" id="overlay-title">Chomp</h1>
    <p class="overlay__body" id="overlay-body"></p>
    <div class="overlay__actions" id="overlay-actions"></div>
  </div>
</div>

<p class="sr-only" role="status" aria-live="polite" id="live-region"></p>

<!-- Classic script, and it must load before the module: js/shared/net/
     leaderboard.js reads window.supabase at module top level. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="../../js/games/chomp/main.js"></script>
</body>
</html>
