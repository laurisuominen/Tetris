<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Standard zoomable viewport. The games lock zoom so a pinch cannot fire
     mid-play; this page is an ordinary document and has no reason to, so it
     stays WCAG 1.4.4 clean. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#111318">
<meta name="description" content="A small browser arcade — vanilla JavaScript games that install, play offline and work on touch.">
<!-- Tighter than the games': the hub talks to nothing off-origin. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arcade">
<meta name="mobile-web-app-capable" content="yes">

<title>Arcade</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/hub.css">
</head>
<body>

<div class="shell">

  <header class="masthead">
    <!-- Deliberately a plain link with no session state. Rendering "Signed in
         as X" here would mean loading the Supabase SDK, which would mean
         relaxing this page's CSP (it is tighter than the games': no jsDelivr,
         no connect-src) and giving up the hub's offline-first boot. The
         account page shows the state instead. -->
    <nav class="masthead__nav" aria-label="Account">
      <a class="masthead__link" href="account/">Account</a>
    </nav>
    <h1 class="masthead__title">Arcade</h1>
    <p class="masthead__lead">
      Small games built in vanilla JavaScript — no framework, no build step.
      They install as an app and play offline.
    </p>
  </header>

  <main>
    <h2 class="sr-only">Games</h2>
    <nav class="games" id="games" aria-label="Games"></nav>
  </main>

  <footer class="colophon">
    <span>Vanilla ES modules. No dependencies.</span>
    <a href="games/tetris/about/">About Tetris</a>
    <!-- Points at the GitHub-rendered copy rather than /LICENSE.md: Pages
         serves .md as text/markdown, which a browser may download instead of
         displaying. One source of truth, and it always renders. -->
    <a href="https://github.com/laurisuominen/Tetris/blob/main/LICENSE.md">Licence</a>
  </footer>

</div>

<script type="module" src="js/hub/hub.js"></script>
</body>
</html>
